name: tests

on:
  push:
    branches:
      - '*.*.x'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        inertia: ['none', '^2.0.17', '^3.3.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Install optional Inertia integration
        if: matrix.inertia != 'none'
        env:
          INERTIA_VERSION: ${{ matrix.inertia }}
        run: composer require --dev "inertiajs/inertia-laravel:$INERTIA_VERSION" --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.inertia != 'none'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: vendor/bin/pest
